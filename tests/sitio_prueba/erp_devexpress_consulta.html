  v3.8: la consulta del ERP real, como la dibuja DevExpress (ids de ASP.NET):

  - Empleado / Ubicación: campo de búsqueda DOBLE: código (ASPxTextBox «wbe…_txtCod»), id oculto («…_txtId») y

  - Barra de la rejilla: «Vista» y el formato (XLSX) son ASPxComboBox dentro de un menú DevExpress; delante del formato
    hay un panel de carga oculto con el texto «Espere…»; «Exportar» y «Consultar» son opciones del menú.
  - Rejilla ASPxGridView con su fila de filtros por columna («…_DXFREditorcolN»): no son filtros del reporte.
  - «Ver bajas»: ASPxCheckBox (un <span> con la clase …Checked/…Unchecked y un <input> oculto «…_S» con C/U).
  «Exportar» descarga /api/erp/descarga?almacen=<empleado>|<ubicación>|<bajas>&fecha=<desde>-<hasta>.
  Las fechas son como las del ERP real (ASPxDateEdit con máscara): la fecha de verdad está en el control (…_State,
  rawValue); lo que se pone en el campo sin teclear (fill, JavaScript) no cuenta y, al salir del campo, vuelve la fecha
  del control.  El control se cambia con SetDate (ASPxClientControl.GetControlCollection().GetByName(id)) o tecleando.
-->

  <div id="resultado" style="margin-top:10px"></div>
  <script>
    // ASPxDateEdit con máscara (como el ERP real): la fecha de verdad es la del control, no el texto del campo
    var controles = {};
    window.ASPxClientControl = { GetControlCollection: function () {
      return { GetByName: function (n) { return controles[n] || null; }, Get: function (n) { return controles[n] || null; } }; } };
    function fmtFecha(d) { return d ? ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear() : ''; }
    function leerFecha(t) { var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t || ''); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; }
    ['ctl00_formContent_dteFechaDesde', 'ctl00_formContent_dteFechaHasta'].forEach(function (id) {
      var inp = document.getElementById(id + '_I'), st = document.getElementById(id + '_State');
      var fecha = leerFecha(inp.value), tecleado = false;
      var c = {
        SetDate: function (d) { fecha = d ? new Date(d.getFullYear(), d.getMonth(), d.getDate()) : null; inp.value = fmtFecha(fecha);
          st.value = JSON.stringify({ rawValue: fecha ? String(fecha.getTime()) : 'N' }); },
        GetDate: function () { return fecha ? new Date(fecha.getTime()) : null; }
      };
      controles[id] = c; window[id] = c;
      inp.addEventListener('keydown', function () { tecleado = true; });
      inp.addEventListener('blur', function () {
        if (tecleado) { var d = leerFecha(inp.value); if (d) c.SetDate(d); }
        inp.value = fmtFecha(fecha); tecleado = false;
      });
      c.SetDate(fecha);
    });
    // ASPxComboBox (Vista y formato): abrir con el campo o el botón «…_B-1», elegir una fila
    ['ITCNT0_cbo0', 'ITCNT4_cbo4'].forEach(function (k) {
      var base = 'ctl00_formContent_wuc_1000_01_GridViewToolbar1_wuc100001_mainMenu_' + k;
      var caja = document.getElementById(base), input = document.getElementById(base + '_I');
      var pop = document.getElementById(base + '_DDD_PW-1');
      function abrir() { var r = caja.getBoundingClientRect(); pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + scrollY) + 'px'; pop.style.display = 'block'; }
      function alternar() { pop.style.display === 'block' ? pop.style.display = 'none' : abrir(); }
      input.addEventListener('mousedown', alternar);
      document.getElementById(base + '_B-1').addEventListener('mousedown', alternar);
      pop.querySelectorAll('.dxeListBoxItem').forEach(function (td) {
        td.addEventListener('click', function () { input.value = td.textContent; pop.style.display = 'none'; });
      });
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.querySelectorAll('.dxpcDropDown').forEach(function (p) { p.style.display = 'none'; }); });
    // Campo doble: al escribir el código, el ERP rellena el id y la descripción
    ['wbeEmpleado', 'wbeUbicacion'].forEach(function (w) {
      var cod = document.getElementById(w + '_txtCod_I');
      cod.addEventListener('input', function () {
        document.getElementById(w + '_txtId_I').value = cod.value ? '9' + cod.value : '';
        document.getElementById(w + '_txtDescrip_I').value = cod.value ? 'DESCRIPCION ' + cod.value : '';
      });
      document.getElementById(w + '_txtDescrip_B0').addEventListener('click', function () { window.lupaAbierta = w; });
    });
    // ASPxCheckBox «Ver bajas»
    var chk = document.getElementById('ctl00_formContent_grdListado_FooterRow_chkRegistrosBaja_S_D');
    var chkVal = document.getElementById('ctl00_formContent_grdListado_FooterRow_chkRegistrosBaja_S');
    chk.addEventListener('click', function () {
      var marcada = /Unchecked/.test(chk.className);
      chk.className = 'dxICheckBox dxichSys ' + (marcada ? 'dxWeb_edtCheckBoxChecked' : 'dxWeb_edtCheckBoxUnchecked');
      chkVal.value = marcada ? 'C' : 'U';
    });
    var consultado = '';
    var menu = 'ctl00_formContent_wuc_1000_01_GridViewToolbar1_wuc100001_mainMenu_';
    function v(id) { return document.getElementById(id).value; }
    document.getElementById(menu + 'DXI6_').addEventListener('click', function () {
      consultado = [v('wbeEmpleado_txtCod_I'), v('wbeUbicacion_txtCod_I'), chkVal.value].join('|') + '#' +
        fmtFecha(controles.ctl00_formContent_dteFechaDesde.GetDate()) + '-' + fmtFecha(controles.ctl00_formContent_dteFechaHasta.GetDate());
      document.getElementById('resultado').textContent = 'Consulta: ' + consultado;
    });
    document.getElementById(menu + 'DXI5_').addEventListener('click', function () {
      if (!consultado) return;
      var p = consultado.split('#');
      var a = document.createElement('a');
      a.href = '/api/erp/descarga?almacen=' + encodeURIComponent(p[0]) + '&fecha=' + encodeURIComponent(p[1]);
      a.setAttribute('download', ''); document.body.appendChild(a); a.click(); a.remove();
    });
  </script>
