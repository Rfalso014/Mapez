<!doctype html>

<title>Reporte de comisiones</title>

</style>
</head>
<body>
  <h1>Reporte de comisiones</h1>

      <tr><td>Ana</td><td>Plan "premium"</td><td>99.99</td></tr>

  </table>

</html>
