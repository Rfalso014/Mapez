<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portal SPA (prueba)</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; }
  nav { background: #c00; padding: 8px 16px; } nav a { color: #fff; margin-right: 16px; }
  main { padding: 24px 32px; }
  .v-tabs { display: flex; gap: 4px; border-bottom: 1px solid #ccc; margin-bottom: 18px; }
  .v-tab { border: 0; background: none; padding: 10px 18px; cursor: pointer; font: inherit; }
  .v-tab--selected { border-bottom: 3px solid #c00; font-weight: 600; }
  .fila { margin-bottom: 14px; }
</style>
</head>
<body>
<!--
  Web de una sola página con rutas tras «#» como Portal (v3.3.1):
  - Sin sesión (sessionStorage «sesion_spa»: cada vez que se abre el navegador hay que entrar), CUALQUIER ruta (p. ej. #/reportes/corte) muestra el inicio de sesión
    (con ?redir=1 la dirección cambia además a #/inicio-sesion).
  - Al entrar (usuario demo, contraseña clave-de-prueba-123) la web va SIEMPRE a #/inicio (no a la ruta pedida).
  - #/reportes/corte: pestañas «Corte» (elegida) / «Crédito»; «Seleccione reporte» y «Elegir corte» (listas nativas;
    los cortes dependen del reporte) y «Generar» → descarga /api/portal/descarga.
  - ?auto=1 (para el mapeo): inicia sesión sola, y desde #/inicio va sola a #/reportes/corte y quita ?auto de la dirección
    (como el usuario que entra y abre Reportes a mano).
  Cada envío del formulario suma 1 a localStorage «envios_spa».
-->
<nav><a href="#/inicio">Inicio</a><a href="#/reportes/corte">Reportes</a></nav>
<main id="vista"></main>
<script>
  var q = new URLSearchParams(location.search);
  var vista = document.getElementById('vista');
  function sesion() { return !!sessionStorage.getItem('sesion_spa'); }
  function ruta() { return (location.hash || '#/inicio').replace(/^#/, ''); }
  function login() {
    if (q.get('redir') === '1' && ruta() !== '/inicio-sesion') { location.replace('#/inicio-sesion'); return; }
    vista.innerHTML = '<h1>Inicia sesión</h1><form onsubmit="return false">' +
      '<div class="fila"><input id="input-v-0" type="text" placeholder="Usuario (código)" autocomplete="off"></div>' +
      '<div class="fila"><input id="input-v-2" type="password" placeholder="Contraseña" autocomplete="off"></div>' +
      '<button type="button" id="btn-entrar">Iniciar Sesion</button><div id="error" role="alert"></div></form>';
    document.getElementById('btn-entrar').addEventListener('click', function () {
      localStorage.setItem('envios_spa', String(parseInt(localStorage.getItem('envios_spa') || '0', 10) + 1));
      var u = document.getElementById('input-v-0').value, c = document.getElementById('input-v-2').value;
      setTimeout(function () {
        if (u === 'demo' && c === 'clave-de-prueba-123') { sessionStorage.setItem('sesion_spa', 'ok'); location.hash = '#/inicio'; pintar(); }
        else document.getElementById('error').textContent = 'Usuario o contraseña incorrectos';
      }, 300);
    });
    if (q.get('auto') === '1') {
      document.getElementById('input-v-0').value = 'demo';
      document.getElementById('input-v-2').value = 'clave-de-prueba-123';
      setTimeout(function () { document.getElementById('btn-entrar').click(); }, 200);
    }
  }
  function cortes(rep) {
    if (!rep) return [];
    return rep === 'Cartera General' ? ['Septiembre 2026', 'Octubre 2026'] :
      ['43 - 2026 (02/10/2026 - 08/10/2026)', '44 - 2026 (09/10/2026 - 15/10/2026)'];
  }
  function reportes() {
    vista.innerHTML = '<div class="v-tabs" role="tablist">' +
      '<button type="button" class="v-tab v-tab--selected" role="tab" aria-selected="true">Corte</button>' +
      '<button type="button" class="v-tab" role="tab" aria-selected="false">Crédito</button></div>' +
      '<form onsubmit="return false"><div class="fila"><label for="reporte">Seleccione reporte</label><br>' +
      '<select id="reporte"><option value=""></option><option>Detalles Ventas Mayorista</option><option>Cartera General</option></select></div>' +
      '<div class="fila"><label for="corte">Elegir corte</label><br><select id="corte"></select></div>' +
      '<div class="fila"><button type="button" id="generar">Generar</button></div></form>';
    var rep = document.getElementById('reporte'), corte = document.getElementById('corte');
    rep.addEventListener('change', function () {
      corte.innerHTML = cortes(rep.value).map(function (t) { return '<option>' + t + '</option>'; }).join('');
    });
    document.getElementById('generar').addEventListener('click', function () {
      location.href = '/api/portal/descarga?reporte=' + encodeURIComponent(rep.value) + '&corte=' + encodeURIComponent(corte.value) + '&formato=csv';
    });
  }
  function pintar() {
    if (!sesion()) return login();
    var r = ruta();
    if (r === '/reportes/corte') return reportes();
    if (r !== '/inicio') { location.replace('#/inicio'); return; }
    vista.innerHTML = '<h1>Inicio</h1><p>Bienvenido.</p>';
    if (q.get('auto') === '1') {
      setTimeout(function () { history.replaceState(null, '', location.pathname + '#/reportes/corte'); pintar(); }, 300);
    }
  }
  window.addEventListener('hashchange', pintar);
  pintar();
</script>
</body>
</html>
